[tool.poetry]
name = "business_management_system"
version = "0.1.0"
description = ""
authors = ["anna putilovskaya <putilovskayaam@gmail.com>"]
package-mode = false
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = {extras = ["standard"], version = "^0.115.12"}
asyncpg = "^0.30.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.40"}
alembic = "^1.15.2"
pydantic-settings = "^2.9.1"
fastapi-users = {extras = ["sqlalchemy"], version = "^14.0.1"}
sqladmin = {extras = ["full"], version = "^0.20.1"}
alembic-postgresql-enum = "^1.7.0"
pyjwt = {extras = ["crypto"], version = "^2.10"}


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-asyncio = "^1.0.0"
pytest-cov = "^6.1.1"
asgi-lifespan = "^2.1.0"
ruff = "^0.8"
httpx = "^0.28"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["src"]
omit = ["src/alembic/*"]

[tool.coverage.report]
show_missing = true
